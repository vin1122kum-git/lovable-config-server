server:
  port: 7070

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Account Service
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/account/**
              filters:
                - StripPrefix=2

            # Workspace Service
            - id: workspace-service
              uri: lb://workspace-service
              predicates:
                - Path=/api/v1/workspace/**
              filters:
                - StripPrefix=2

            # Intelligence Service
            - id: intelligent-service
              uri: lb://intelligent-service
              predicates:
                - Path=/api/v1/intelligent/**
              filters:
                - StripPrefix=2
